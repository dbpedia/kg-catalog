name: Monthly KG Catalog metadata release

on:
  schedule:
    - cron: '17 6 1 * *' # Monthly, 1st day at 06:17 UTC (schedule may be delayed)
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub Release? Leave unchecked for a dry run.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: kg-catalog-monthly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main branch (including tags)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install 'requests>=2.31,<3' 'rdflib>=7,<8' 'PyYAML>=6,<7'

      - name: Compute monthly release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          tag="kg-catalog-$(date -u +%Y-%m)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = schedule ] || [ "$INPUT_PUBLISH" = true ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against overwriting a published monthly release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Find previous monthly snapshot (fail if history is incomplete)
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            > "$RUNNER_TEMP/kg-catalog-releases.json"
          git tag --list 'kg-catalog-*' > "$RUNNER_TEMP/kg-catalog-tags.txt"
          python scripts/select_previous_release.py --current "$TAG" \
            --releases-json "$RUNNER_TEMP/kg-catalog-releases.json" \
            --git-tags "$RUNNER_TEMP/kg-catalog-tags.txt" \
            >> "$GITHUB_OUTPUT"

      - name: Download previous published metadata snapshot
        if: steps.previous.outputs.mode == 'comparison'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          mkdir -p previous
          gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PREV_TAG.zip" --dir previous
          if [ ! -s "previous/$PREV_TAG.zip" ]; then
            echo "Missing/empty historical archive for $PREV_TAG; refusing incomplete comparison"
            exit 1
          fi

      - name: Export GitHub YAML metadata
        run: python scripts/export_yaml_catalog.py --repo . --output kg-source-metadata --no-zip

      - name: Export Databus group, artifact and version metadata
        run: python scripts/fetch_databus_catalog_fixed.py --output kg-release-metadata

      - name: Export MOSS KG metadata
        run: python scripts/fetch_moss_catalog.py --output kg-level-metadata

      - name: Assemble and analyze snapshot
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
          PREV_MODE: ${{ steps.previous.outputs.mode }}
        run: |
          if [ "$PREV_MODE" = comparison ]; then
            python scripts/build_monthly_release.py --release "$TAG" \
              --previous-tag "$PREV_TAG" --previous-archive "previous/$PREV_TAG.zip"
          elif [ "$PREV_MODE" = baseline ]; then
            python scripts/build_monthly_release.py --release "$TAG" --first-release
          else
            echo "Unexpected previous-release mode: $PREV_MODE"
            exit 1
          fi

      - name: Upload dry-run / troubleshooting artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}-candidate
          path: |
            release-assets/
          retention-days: 14

      - name: Publish monthly GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          month=$(date -u -d "${TAG#kg-catalog-}-01" '+%B %Y')
          gh release create "$TAG" \
            "release-assets/$TAG.zip" \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "DBpedia KG Catalog — $month" \
            --notes-file release-assets/release-notes.md \
            --latest
