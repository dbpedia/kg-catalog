databus-account: knowledge-graph-catalog
id: eobs-kg
title: EOBS Knowledge graph
abstract: EOBS-KG is a knowledge graph of European climate observations covering the
  time period 1950-2024.
description: EOBS-KG is a knowledge graph providing structured data about climate
  variables such as mean/min/max temperature, precipitation, relative humidity, and
  wind speed for Europe. The knowledge graph contains about 3 billion triples, covers
  the period 1950-2024.
moss-publish: false
databus-publish: false
