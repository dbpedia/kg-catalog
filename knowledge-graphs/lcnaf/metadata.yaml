id: lcnaf
title: Library of Congress Name Authority File (LCNAF)
abstract: The Library of Congress Name Authority File is a linked-data authority graph
  identifying people, organizations, works, and other named entities.
description: The Library of Congress Name Authority File (LCNAF) provides persistent
  identifiers, authorized and variant names, and relationships for people, organizations,
  works, and other named entities used in library cataloging. The Library of Congress
  Linked Data Service publishes the complete authority file in MADS/RDF as compressed
  N-Triples. This catalog record references the full MADS/RDF bulk export, not a SKOS
  vocabulary-only representation.
