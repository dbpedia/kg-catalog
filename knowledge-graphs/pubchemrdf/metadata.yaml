databus-account: knowledge-graph-catalog
id: pubchemrdf
title: PubChemRDF
abstract: >-
  PubChemRDF publishes structured chemical and biomedical knowledge as RDF,
  linking genes, taxonomic entities, bioassays, pathways, diseases and other resources.
description: >-
  PubChemRDF is the RDF representation of information provided by PubChem at
  the National Center for Biotechnology Information (NCBI). It describes
  chemical and biomedical entities and their relationships, with interlinked
  subdomains distributed as compressed Turtle files. This catalog record
  currently covers five selected PubChemRDF subdomains (gene, taxonomy,
  bioassay, pathway, and disease), not the complete PubChemRDF dataset.
moss-publish: true
databus-publish: true
license: https://www.ncbi.nlm.nih.gov/home/about/policies/
homepage: https://pubchem.ncbi.nlm.nih.gov/docs/rdf
domains:
  - Life Sciences & Health
keywords:
  - PubChem
  - chemistry
  - biomedical knowledge graph
  - genes
  - taxonomy
  - bioassays
  - pathways
  - diseases
  - RDF
  - Turtle
artifacts:
  - artifact: gene
    title: PubChemRDF Gene
    abstract: RDF descriptions of gene entities and their biological relationships.
    description: >-
      Gene entities in PubChemRDF, including identifiers, names,
      biological functions, and links to related resources.
    versions:
      - version: rolling
        title: PubChemRDF Gene (rolling)
        abstract: RDF descriptions of gene entities and their biological relationships.
        description: >-
          The currently published RDF dump of PubChemRDF gene entities.
          PubChem updates the RDF database approximately monthly.
        license: https://www.ncbi.nlm.nih.gov/home/about/policies/
        distributions:
          - file: https://ftp.ncbi.nlm.nih.gov/pubchem/RDF/gene/pc_gene.ttl.gz
            format: ttl
            compression: gz
            status: pending

  - artifact: taxonomy
    title: PubChemRDF Taxonomy
