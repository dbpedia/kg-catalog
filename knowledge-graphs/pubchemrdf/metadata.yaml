    description: >-
      Taxonomic entities, their identifiers and labels, and links to other
      PubChemRDF subdomains and external biological resources.
    versions:
      - version: rolling
        title: PubChemRDF Taxonomy (rolling)
        abstract: RDF descriptions of taxonomic entities linked to PubChem resources.
        description: The currently published PubChemRDF taxonomy dump.
        license: https://www.ncbi.nlm.nih.gov/home/about/policies/
        distributions:
          - file: https://ftp.ncbi.nlm.nih.gov/pubchem/RDF/taxonomy/pc_taxonomy.ttl.gz
            format: ttl
            compression: gz
            status: pending

  - artifact: bioassay
    title: PubChemRDF BioAssay
    abstract: RDF descriptions of biological assays and their associated entities.
    description: >-
      PubChem bioassay entities, titles, identifiers, assay relationships,
