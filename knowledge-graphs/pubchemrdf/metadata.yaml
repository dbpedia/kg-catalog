    versions:
      - version: rolling
        title: PubChemRDF BioAssay (rolling)
        abstract: RDF descriptions of biological assays and their associated entities.
        description: The currently published PubChemRDF bioassay dump.
        license: https://www.ncbi.nlm.nih.gov/home/about/policies/
        distributions:
          - file: https://ftp.ncbi.nlm.nih.gov/pubchem/RDF/bioassay/pc_bioassay.ttl.gz
