databus-account: knowledge-graph-catalog
id: pubchemrdf
title: PubChemRDF
abstract: PubChemRDF publishes structured chemical and biomedical knowledge as RDF,
  linking genes, taxonomic entities, bioassays, pathways, diseases and other resources.
description: PubChemRDF is the RDF representation of information provided by PubChem
  at the National Center for Biotechnology Information (NCBI). It describes chemical
  and biomedical entities and their relationships, with interlinked subdomains distributed
  as compressed Turtle files. This catalog record currently covers five selected PubChemRDF
  subdomains (gene, taxonomy, bioassay, pathway, and disease), not the complete PubChemRDF
  dataset.
