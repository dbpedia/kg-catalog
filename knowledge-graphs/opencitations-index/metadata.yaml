databus-account: knowledge-graph-catalog
id: opencitations-index
title: OpenCitations Index
abstract: OpenCitations Index publishes open RDF citation relationships between scholarly publications.
description: OpenCitations Index is an open citation knowledge graph linking bibliographic resources
  identified by OpenCitations Meta identifiers (OMIDs). The July 2026 release, published on
  28 July 2026, contains 2,559,460,009 citations. This catalog record covers the citation data
  and citation source information in N-Triples format, not the separate provenance dump or alternative
  database and non-RDF exports.
moss-publish: true
