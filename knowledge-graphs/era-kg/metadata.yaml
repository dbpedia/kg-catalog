id: era-kg
title: ERA Knowledge Graph
abstract: The European Union Agency for Railways knowledge graph describes railway infrastructure,
  places and linked operational information.
description: The ERA Knowledge Graph integrates factual European railway infrastructure data.
  Version v8 supplies the entire archived graph in N-Quads format inside a ZIP archive, describing
  real operational points, railway assets and their relationships. This is the KG instance dataset,
  not just the ERA ontology.
