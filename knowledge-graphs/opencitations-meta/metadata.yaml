databus-account: knowledge-graph-catalog
id: opencitations-meta
title: OpenCitations Meta
abstract: OpenCitations Meta publishes RDF metadata for scholarly publications and agents.
description: OpenCitations Meta describes bibliographic resources, authors, venues and associated provenance. The September 2026 RDF release (v9.2.1) is archived on Zenodo as five compressed 7z files containing JSON-LD RDF metadata and provenance.
moss-publish: true
databus-publish: true
license: https://creativecommons.org/publicdomain/zero/1.0/
homepage: https://opencitations.net/meta
domains:
  - Publications, Education & Research
keywords:
  - bibliographic metadata
  - scientific publications
  - authors
  - citation metadata
  - JSON-LD
  - RDF
