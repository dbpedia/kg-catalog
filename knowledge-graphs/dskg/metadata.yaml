databus-account: knowledge-graph-catalog
id: dskg
title: Data Set Knowledge Graph
abstract: The Data Set Knowledge Graph (DSKG) is an RDF knowledge graph describing
  research datasets and linking them to scientific publications in which the datasets
  are mentioned.
description: The Data Set Knowledge Graph (DSKG) provides structured metadata about
  research datasets from OpenAIRE and Wikidata. It links datasets to scientific publications
  in the Microsoft Academic Knowledge Graph (MAKG) in which the datasets are mentioned.
  DSKG uses standard vocabularies such as DCAT and provides Linked Data URI resolution,
  RDF dumps, and a public SPARQL endpoint. The graph contains 2,208 datasets, 813,551
  links to 634,803 scientific publications, 1,169 dataset authors, and 208 ORCID IDs.
