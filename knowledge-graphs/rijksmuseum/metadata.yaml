abstract: RDF knowledge about Rijksmuseum library resources, exhibitions, historical
  events, people, organisations and places.
description: 'Rijksmuseum publishes linked cultural heritage and bibliographic data
  using Linked Art, CIDOC CRM and Schema.org. This entry covers selected current multi-domain
  RDF archives. Official downloads: [https://data.rijksmuseum.nl/docs/data-dumps/](https://data.rijksmuseum.nl/docs/data-dumps/)'
