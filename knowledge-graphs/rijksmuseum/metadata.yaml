databus-account: knowledge-graph-catalog
id: rijksmuseum
title: Rijksmuseum Knowledge Graph
abstract: RDF knowledge about Rijksmuseum library resources, exhibitions, historical events, people, organisations
  and places.
description: 'Rijksmuseum publishes linked cultural heritage and bibliographic data using Linked Art, CIDOC CRM
  and Schema.org. This entry covers selected current multi-domain RDF archives. Official downloads: [https://data.rijksmuseum.nl/docs/data-dumps/](https://data.rijksmuseum.nl/docs/data-dumps/)'
moss-publish: true
databus-publish: true
license: https://data.rijksmuseum.nl/policy/
homepage: https://data.rijksmuseum.nl/
domains:
- Media, Culture & Entertainment
keywords:
- cultural heritage
- bibliographic metadata
- museum exhibitions
- Linked Art
- CIDOC CRM
- Schema.org
- RDF
# Version inferred from official archive paths, not a separately confirmed release date.
# Archive-specific license not confirmed; the institutional data policy is referenced.
# Signed download URLs expire on 2028-10-21 at 14:43 UTC.
# TAR archives contain N-Triples; hashes and sizes are calculated by the publisher.
artifacts:
- artifact: person
  title: Rijksmuseum Persons
  abstract: Bibliographic persons described using Schema.org Person.
  description: Bibliographic persons described using Schema.org Person. Distributed as a gzip-compressed TAR archive
    containing N-Triples files.
  versions:
  - version: '2024-11-07'
    title: Rijksmuseum Persons 2024-11-07
    abstract: Bibliographic persons described using Schema.org Person.
    description: Official multi-domain RDF archive containing 181,379 resource files, as listed by Rijksmuseum.
      The version date is inferred from the download URL.
    license: https://data.rijksmuseum.nl/policy/
    distributions:
