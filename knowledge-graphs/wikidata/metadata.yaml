databus-account: knowledge-graph-catalog
id: wikidata
title: Wikidata

abstract: >-
  Wikidata is a free and collaborative knowledge graph containing structured
  data about entities, including people, places, organizations, works,
  scientific concepts, and other topics.

description: >-
  Wikidata is a large-scale, collaboratively maintained knowledge graph
  operated by the Wikimedia Foundation. It provides structured data about
  entities and their relationships, including labels, descriptions, aliases,
  statements, qualifiers, references, identifiers, and interlanguage links.

moss-publish: true
databus-publish: true

license: https://creativecommons.org/publicdomain/zero/1.0/
homepage: https://www.wikidata.org/

domains:
- Knowledge Graphs
- General

keywords:
- Wikidata
- knowledge graph
- linked open data
- RDF
- structured data
- Wikimedia
- semantic web

sparql:
- name: main
  url: https://query.wikidata.org/

maintainers:
- name: Wikimedia Foundation
  contact: https://www.wikidata.org/wiki/Wikidata:Contacting_the_development_team

