databus-account: knowledge-graph-catalog
id: caligraph
title: CaLiGraph
abstract: CaLiGraph is a general-purpose knowledge graph derived from Wikipedia categories
  and lists.
description: CaLiGraph integrates Wikipedia categories, lists, and other source material
  into a typed knowledge graph with entities, taxonomic types, labels, and relations.
  This record points to an archived RDF distribution.
