databus-account: knowledge-graph-catalog
id: cs-kg
title: Computer Science Knowledge Graph (CS-KG 2.0)
abstract: CS-KG 2.0 links computer science research concepts, methods, tasks, metrics
  and other entities extracted from scientific publications.
description: CS-KG 2.0 is an instance-level scientific knowledge graph derived from
  approximately 14.5 million computer science publications. It describes scientific
  entities and their factual and semantic relationships. The official RDF release
  is provided as a ZIP archive containing Turtle data.
