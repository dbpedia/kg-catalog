databus-account: knowledge-graph-catalog
id: mira-kg
title: MIRA-KG
abstract: A knowledge graph of hypotheses and findings for social demography research.
description: '**MIRA-KG** is a knowledge graph for representing hypotheses and findings
  in social demography research and linking them to evidence.

  The knowledge graph consists of an ontology for capturing social demography research,
  which links hypotheses and findings to evidence, and annotations of papers on health
  inequality in terms of the ontology. The annotations were generated by prompting
  a Large Language Model to annotate paper abstracts using the ontology, mapping concepts
  to terms from NCBO BioPortal ontologies and GeoNames, and refining the final graph
  using SHACL constraints developed according to data quality criteria.

  The resource supports the formal representation of social demography research hypotheses,
  the discovery of research biases, knowledge discovery, and the derivation of novel
  research questions.

  The dataset was generated using the MIRA project code available at https://w3id.org/mira/
  and uses the MIRA ontology.'
