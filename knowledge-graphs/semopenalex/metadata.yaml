databus-account: knowledge-graph-catalog
id: semopenalex
title: SemOpenAlex

abstract: >-
  SemOpenAlex is a large-scale RDF knowledge graph of the global scientific
  landscape based on OpenAlex, covering publications, authors, institutions,
  sources, publishers, funders, and research concepts.

description: >-
  SemOpenAlex provides the OpenAlex scholarly dataset as an RDF knowledge
  graph following Linked Data principles. It contains billions of RDF triples
  describing scientific publications and related scholarly entities. SemOpenAlex
  provides resolvable URIs, a public SPARQL endpoint, and full RDF snapshots
  in compressed TriG format via its public AWS S3 bucket.

moss-publish: true
databus-publish: true

license: https://creativecommons.org/publicdomain/zero/1.0/
homepage: https://semopenalex.org/

domains:
- Publications, Education & Research

keywords:
- scholarly data
- scientific publications
- OpenAlex
- knowledge graph
- linked data
- RDF
- open science
- bibliographic data

