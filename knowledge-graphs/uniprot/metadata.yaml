databus-account: knowledge-graph-catalog
id: uniprot
title: UniProt — Reviewed Protein Knowledge Graph
abstract: UniProt provides an RDF knowledge graph of proteins, organisms, proteomes, functional annotations,
  and associated relationships.
description: UniProt is a curated protein resource maintained by the UniProt Consortium. This catalog
  entry covers the complete reviewed UniProtKB/Swiss-Prot RDF/XML taxonomic partitions together with UniProt
  proteomes and taxonomy instance data (35 compressed RDF files). It excludes the much larger unreviewed
  UniProtKB/TrEMBL, UniRef, and UniParc datasets. RDF files are downloaded from a publicly indexed mirror
  of the UniProt current-release directory; content may change with each release.
moss-publish: true
databus-publish: true
license: https://creativecommons.org/licenses/by/4.0/
homepage: https://www.uniprot.org/
domains:
- Life Sciences & Health
keywords:
- UniProt
- UniProtKB
- Swiss-Prot
- proteins
- proteomes
- taxonomy
- biological annotations
- RDF/XML
