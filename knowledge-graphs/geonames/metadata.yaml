databus-account: knowledge-graph-catalog
id: geonames
title: GeoNames
abstract: GeoNames is a global geographical knowledge graph containing structured information about places, geographical features, names, administrative divisions, and other geographic entities.
description: '**GeoNames** is a free geographical database and knowledge graph covering geographical features and place names worldwide.


  **Overview**

  GeoNames contains over 11 million geographical features and more than 25 million geographical names. Each feature is identified by a unique URI and described using the GeoNames Ontology.


  **Data**

  - Geographical feature names and alternate names
  - Countries and administrative divisions
  - Populated places and other geographical features
  - Geographic coordinates
  - Feature classes and feature codes
  - Population and elevation information
  - Postal codes
  - Relationships between geographical features
  - Links to Wikipedia and other resources


  **GeoNames Ontology**

  The RDF data uses the GeoNames Ontology, which provides classes and properties for representing geographic features and their relationships. GeoNames features are exposed as Linked Data using URIs of the form `https://sws.geonames.org/{geonameId}/`.


  **RDF Dump**

  The RDF dump contains RDF descriptions of GeoNames toponyms and can be used to build a local representation of the GeoNames knowledge graph.


  '
