databus-account: knowledge-graph-catalog
id: mlsea-kg
title: MLSea-KG
abstract: MLSea-KG links machine learning experiments, datasets, models and related
  research resources.
description: MLSea-KG publishes machine-learning experiment and resource metadata
  collected from platforms such as Kaggle and OpenML. Its RDF N-Triples releases are
  split into compressed partitions.
moss-publish: false
databus-publish: false
license: https://creativecommons.org/publicdomain/zero/1.0/
homepage: https://zenodo.org/records/17954333
domains:
- Publications, Education & Research
keywords:
- machine learning
- experiments
- Kaggle
- OpenML
- datasets
- RDF
