databus-account: knowledge-graph-catalog
id: linked-papers-with-code
title: Linked Papers With Code

abstract: >-
  Linked Papers With Code (LPWC) is an RDF knowledge graph describing
  the machine learning research landscape, including papers, tasks,
  datasets, methods, evaluations, and results.

description: >-
  Linked Papers With Code (LPWC) is a scholarly RDF knowledge graph based
  on Papers With Code. It models more than 400,000 machine learning
  publications together with the tasks they address, datasets they use,
  methods they apply, and evaluation results. LPWC provides resolvable
  Linked Data URIs, RDF dumps, a public SPARQL endpoint, and links to
  external resources such as SemOpenAlex, Wikidata, and DBLP.

