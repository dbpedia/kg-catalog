title: EURIO Knowledge Graph (CORDIS)
abstract: The EURIO Knowledge Graph describes EU-funded research projects, organisations and results
  as linked RDF data.
description: The EURIO Knowledge Graph publishes interconnected CORDIS records about EU-funded
  research projects, participating organisations, programme funding, and research outputs. This
  artifact is the publisher-provided full N-Quads dump as a ZIP archive, not the EURIO ontology
  alone.
