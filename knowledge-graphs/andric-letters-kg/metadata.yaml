databus-account: knowledge-graph-catalog
id: andric-letters-kg
title: "Ivo Andri\u0107 Letters Knowledge Graph"
abstract: "A knowledge graph representing a selected corpus of Ivo Andri\u0107\u2019\
  s correspondence with Zdenka Markovi\u0107. It models letters, persons, places,\
  \ organizations, and dates as RDF, with selected entities linked to Wikidata."
description: "The Ivo Andri\u0107 Letters Knowledge Graph is derived from a selected\
  \ corpus of correspondence written by [Ivo Andri\u0107](https://www.wikidata.org/wiki/Q47561),\
  \ a Yugoslav writer and Nobel Prize Laureate, to [Zdenka Markovi\u0107](https://www.enciklopedija.hr/clanak/markovic-zdenka),\
  \ a Croatian writer and translator.\nThe graph was created using a semi-automated\
  \ pipeline that combines text recognition with Transkribus, letter segmentation,\
  \ Named Entity Recognition (NER), entity normalization, Named Entity Linking (NEL),\
  \ and RDF generation. It represents individual letters together with their metadata,\
  \ including sender, recipient, date, and place of writing, as well as persons, locations,\
  \ organizations, dates, and other entities mentioned in the correspondence.\nSelected\
  \ entities are linked to Wikidata identifiers, enabling integration with the wider\
  \ Linked Open Data ecosystem. The graph uses established Semantic Web vocabularies,\
  \ including Schema.org, Dublin Core Terms, PROV-O, SKOS, RDFS, and XML Schema datatypes.\n\
  The dataset supports SPARQL-based exploration of the correspondence and can be used\
  \ to investigate people, places, organizations, and other entities occurring in\
  \ Andri\u0107\u2019s letters, as well as the relationships between the letters and\
  \ their broader historical and cultural context.\nThe Knowledge Graph is part of\
  \ a reproducible workflow for transforming historical correspondence into structured\
  \ Linked Data and was developed as part of the project Ivo Andri\u0107 in the European\
  \ Context ([project website](https://www.gralis2.at/gralis/projektarium/Andric/index.html))."
