databus-account: knowledge-graph-catalog
id: sstim
title: Sensory Stimulation Ontology (SSTIM)
abstract: 'SSTIM is an OWL 2 ontology with a multilingual SKOS vocabulary and SHACL
  shapes for describing sensory stimulation: techniques, protocols, exposure conditions,
  observations, safety metadata, and evidence-qualified claims. It models parameters,
  provenance and evidence status.'
description: 'SSTIM provides shared terminology for describing the parameter-specified
  delivery of structured sensory input across auditory, visual, haptic and other modalities,
  so that stimulation sessions, stimuli, devices, exposure conditions and evidence
  can be compared across systems rather than being locked in private schemas.


  The 0.16.0 release contains 11,506 triples: 164 SSTIM OWL classes, 158 object properties
  and 143 datatype properties, plus 551 SKOS concepts across 68 concept schemes. It
  ships SHACL validation shapes, conservative alignments to Wikidata and the OBO upper
  ontologies (BFO, IAO, OBI, COB), and a modular structure with four named profile
  closures (Kernel, Core, Core Plus, Full) declared in a machine-readable manifest.


  Design notes that may matter for cataloguing:


  - **Evidence is first-class and explicitly qualified.** Evidence assessments, observations,
  hypotheses and safety applicability are distinct classes that cannot authorise one
  another, and public claims are gated on applicable, current, provenance-complete
  evidence.

  - **No clinical claims.** SSTIM describes parameters, provenance and evidence status.
  It does not define clinical practice, certify therapeutic efficacy, or model diagnosis
  or treatment. See https://github.com/w3c-cg/sstim/blob/main/docs/concept/SCOPE.md

  - **Persistent identifiers.** `https://w3id.org/sstim` content-negotiates to Turtle,
  JSON-LD and RDF/XML; each release is frozen byte-identical under a version IRI and
  archived on Zenodo with a version DOI under the concept DOI 10.5281/zenodo.21286974.

  - Registered at prefix.cc, catalogued in BARTOC (node 21154) and FAIRsharing (record
  8494), and browsable in NCBO BioPortal.


  Related W3C work: the Sensory Stimulation Vocabulary Community Group (https://www.w3.org/community/sstim/).'
