databus-account: knowledge-graph-catalog
id: open-english-wordnet
title: Open English Wordnet
abstract: Open English Wordnet is an open lexical-semantic knowledge graph of the
  English language, containing words, synsets, definitions, examples, and semantic
  relations.
description: '**Open English Wordnet (OEWN)** is an open lexical database and knowledge
  graph of the English language, derived from Princeton WordNet and developed by the
  Open English Wordnet Community.

  **Overview**

  Open English Wordnet organizes English lexical items into synsets and represents
  their lexical and semantic relationships, including synonymy, hypernymy, hyponymy,
  and other WordNet relations. It covers common nouns, verbs, adjectives, and adverbs.

  The 2025+ edition additionally contains a curated selection of proper nouns from
  Open English Namenet.

  **RDF**

  The RDF distributions are provided in RDF/Turtle format and contain the lexical
  and semantic information of each Open English Wordnet release.'
