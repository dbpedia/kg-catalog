databus-account: knowledge-graph-catalog
id: iicongraph
title: IICONGRAPH
abstract: A knowledge graph of iconographic and iconological statements about cultural
  heritage artifacts, re-engineered from ArCo and Wikidata following the ICON ontology.
description: '**IICONGRAPH** is a knowledge graph of iconographic and iconological statements
  about cultural heritage artifacts. It was created by re-engineering the iconographic and
  iconological statements of ArCo (the Italian knowledge graph of cultural heritage) and
  Wikidata following the ICON ontology, and enriching them with linked open data on cultural
  symbolism from HyperReal.


  The dump has three subsets: IICONGRAPHglobal (ArCo and Wikidata combined), IICONGRAPHarco
  (ArCo only) and IICONGRAPHwikidata (Wikidata only).


  Reference: Sartini, B. (2024). IICONGRAPH: improved Iconographic and Iconological Statements
  in Knowledge Graphs. ESWC 2024. Data: https://doi.org/10.5281/zenodo.10294589'
