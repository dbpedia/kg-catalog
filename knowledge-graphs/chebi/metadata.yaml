databus-account: knowledge-graph-catalog
id: chebi
title: ChEBI
abstract: ChEBI is a curated ontology of chemical entities published in RDF-compatible
  OWL.
description: Chemical Entities of Biological Interest maintains chemical concepts,
  identifiers, annotations, chemical properties and hierarchical relationships. The
  complete OWL ontology is serialized as RDF/XML and published in nightly and monthly
  releases.
