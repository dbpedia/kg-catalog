databus-account: knowledge-graph-catalog
id: lila
title: 'LiLa: Linking Latin'
abstract: LiLa is a knowledge base of interoperable linguistic resources for Latin. Its
  core, the Lemma Bank, is a collection of about 200,000 canonical forms of Latin words
  that interlinks lexical resources and annotated corpora.
description: '**LiLa: Linking Latin** is a knowledge base of linguistic resources for
  Latin published as Linked Open Data.


  Its core is the **Lemma Bank**, a collection of canonical forms (lemmas) of Latin words.
  Entries of lexical resources and tokens of annotated corpora that share a lemma are
  linked to the same Lemma Bank entry, which makes the resources interoperable. The data
  is modelled with the OntoLex-Lemon vocabulary and the LiLa ontology.


  LiLa was built by CIRCSE at the Università Cattolica del Sacro Cuore (Milan) in an ERC
  project (2018–2023). Reference: Passarotti et al. (2020), Studi e Saggi Linguistici
  58(1), 177–212, https://doi.org/10.4454/ssl.v58i1.277'
