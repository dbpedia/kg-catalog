databus-account: knowledge-graph-catalog
id: eventkg
title: EventKG
abstract: EventKG is a multilingual RDF knowledge graph of events, times, locations
  and related entities.
description: EventKG integrates event-centered facts from Wikipedia, Wikidata, and
  other sources. Version 3.2 offers individual N-Quads dumps for entities, events
  and relationships.
