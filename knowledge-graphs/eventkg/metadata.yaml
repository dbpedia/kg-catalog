databus-account: knowledge-graph-catalog
id: eventkg
title: EventKG
abstract: >-
  EventKG is a multilingual RDF knowledge graph of events, times, locations
  and related entities.
description: >-
  EventKG integrates event-centered facts from Wikipedia, Wikidata, and other
  sources. Version 3.2 provides RDF data about events, entities, temporal and
  spatial relationships, and related resources. This record includes three
  individually downloadable N-Quads components and the complete RDF release
  as a gzip-compressed TAR archive.
moss-publish: true
databus-publish: true
license: https://creativecommons.org/licenses/by/4.0/
homepage: https://eventkg.l3s.uni-hannover.de/
domains:
  - Cross-domain
keywords:
  - events
  - time
  - locations
  - multilingual
  - event knowledge graph
  - N-Quads
